name: solar_flutter
description: Biamp SOLAR design tokens, icons and components for Flutter. Generated from Figma.
version: 2.0.0-alpha.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# SOLAR's three families, at the weights its text styles use. A package's fonts are found only
# when a TextStyle names the package, which the generated styles do (package: 'solar_flutter').
# Sources, licences and checksums: fonts/README.md.
flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: fonts/ibm-plex-mono/IBMPlexMono-Medium.ttf
          weight: 500
