# Hand-written decisions about SOLAR Section Nav Group Header, applied over its IR by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Format: packages/codegen/src/normalize/overlay.mjs.

component: Section Nav Group Header

base:
  reason: >-
    The heading of a group of Section Nav Items, its description says: non-interactive, announced
    as a heading so a screen reader names the group. Drawn with the shared layer helpers on both
    platforms, a heading element on the web and a header in Flutter's semantics.

set:
  root.base.width:
    keyword: FILL
    reason: >-
      A heading spans its rail, as its items do: Figma draws it 220 wide, bound to nothing, a sample
      of the rail's width.

allowLiteral:
  root.height:
    reason: >-
      As a Section Nav Item's: SOLAR publishes no height token for a row (owner decision
      2026-09-23, raised as a governance gap). A heading is drawn 32 tall, its items' height.
