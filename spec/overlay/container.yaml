# Hand-written decisions about SOLAR Container, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Container

base:
  reason: >-
    Bespoke on both: a region grouping related content inside a larger surface, drawn from
    Figma's layers with the shared helpers, the caller's content in its slot. It is no control
    and no card (its description: "Not interactive"); no stock component is a padded group.

follows:
  root.borderWidth:
    axes: [type]
    reason: >-
      The outlined container is edged (border.default), the default one has no edge at all, "no
      paint, no border", as its description says and Figma draws.

set:
  root.base.width:
    keyword: FILL
    reason: >-
      A container spans the surface it groups content in: Figma draws it 440 wide, a sample. The
      caller sizes it.
