# Hand-written decisions about SOLAR PIN Input, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: PIN Input

layerNames:
  /Cells/Field/|:
    name: caret
    reason: >-
      Figma names the layer by what it draws, a `|`: the text caret a focused cell shows (it is
      added only in state=focus). A name made of a glyph cannot become code.
  /Cells/Field/1:
    name: digit
    reason: >-
      Figma names each cell's digit by the one it draws, 1 to 6: the digit typed in it. A name
      made of a digit cannot become code.
  /Cells/Field/0:
    name: placeholder
    reason: >-
      Figma names each cell's placeholder by what it draws, a 0, shown while the cell is empty.
  /Cells/Field#2/2:
    name: digit2
    reason: As the first cell’s.
  /Cells/Field#2/0:
    name: placeholder2
    reason: As the first cell’s.
  /Cells/Field#3/3:
    name: digit3
    reason: As the first cell’s.
  /Cells/Field#3/0:
    name: placeholder3
    reason: As the first cell’s.
  /Cells/Field#4/4:
    name: digit4
    reason: As the first cell’s.
  /Cells/Field#4/0:
    name: placeholder4
    reason: As the first cell’s.
  /Cells/Field#5/5:
    name: digit5
    reason: As the first cell’s.
  /Cells/Field#5/0:
    name: placeholder5
    reason: As the first cell’s.
  /Cells/Field#6/6:
    name: digit6
    reason: As the first cell’s.
  /Cells/Field#6/0:
    name: placeholder6
    reason: As the first cell’s.

base:
  reason: >-
    Bespoke on both: a code of one digit per cell, `length` of them (owner decision 2026-09-24: 4
    to 6, six by default), drawn from Figma's layers with the shared helpers. One native input
    holds the code, invisible over the cells (the one-time code a phone offers, a paste, the
    numeric keyboard); the cell the next digit goes in is drawn as Figma's first, which takes the
    hover and the focus, and shows the caret.

slots:
  codeIsIncorrectOrExpired:
    name: errorMessage
    type: text
    reason: >-
      Figma draws what is wrong below the cells in error, in the helper's place ("Code is
      incorrect or expired."), with no prop to fill it: the caller's words, shown in error where
      given.

derive:
  filled:
    when:
      - value: true
        props: [value]
      - value: false
    reason: >-
      A PIN input is filled where it holds its code, which the user types, pastes or a phone
      offers, so it is no prop the caller could set against its content.

follows:
  digit*.color:
    axes: []
    reason: >-
      A digit is drawn in color.text.primary, the one colour Figma gives it, wherever one is
      typed: Figma's filled variant is the only one that draws the digits.
  caret.color:
    axes: []
    reason: As a digit's, the caret's colour, which Figma gives it where it draws it, focused.
  errorMessage.color:
    axes: []
    reason: >-
      As a digit's, the error's colour, color.text.feedback.danger, which Figma gives it where it
      draws it, in error.

set:
  cells.base.height:
    keyword: HUG
    reason: >-
      The row of cells hugs them, as Figma draws it in every md state but the resting one, whose
      row is 48 tall around 40px cells: a slip the design review lists.
  placeholder.size.sm.typography:
    token: typography.body.md.medium
    reason: >-
      The sm cells' placeholders are body.md.medium, as Figma draws them in every cell and state
      but the resting and hovered first cell, whose helper.sm is a slip the design review lists.

allowLiteral:
  field*.width:
    reason: >-
      A cell is 36 by 40 (md) and 28 by 32 (sm), bound to nothing: SOLAR has no control size
      token (the design review's question on control sizes).
  field*.height:
    reason: { as: allowLiteral field*.width }
