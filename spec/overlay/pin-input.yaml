# Hand-written decisions about SOLAR PIN Input, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs. The component's other decisions come with its
# family, F5 of the milestone 4 plan.

component: PIN Input

layerNames:
  /Cells/Field/|:
    name: caret
    reason: >-
      Figma names the layer by what it draws, a `|`: the text caret a focused cell shows (it is
      added only in state=focus). A name made of a glyph cannot become code.
