# Hand-written decisions about SOLAR Tree Item, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs. The component's other decisions come with its
# family, F8 of the milestone 4 plan.

component: Tree Item

layerNames:
  /|Label:
    name: rename input
    reason: >-
      A second label, added only in state=edit, whose text is `|Label`: the row's label as the
      inline input of a rename, with the caret drawn into its text. Its name and the label's reduce
      to one; this names what it is. Whether rename is meant to be a variant goes to the design
      review with Tree Item's family (F8).
