# Hand-written decisions about SOLAR Icon Button, applied over spec/components/icon-button.json by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Addresses use Figma's axis names (prio, not variant); `rename` is applied last.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Icon Button

base:
  mui: IconButton
  flutter: IconButton
  reason: >-
    The closest stock control on each platform. MUI IconButton takes loading and disabled and
    supplies focus handling and keyboard activation; Flutter's IconButton takes a ButtonStyle, as
    FilledButton does for Button, so the same style builder restyles it.

rename:
  prio:
    to: variant
    reason: As Button, whose API names it `variant`; `prio` is the Figma property name.

slots:
  iconNone:
    name: icon
    type: icon
    reason: >-
      The icon is what an icon button is for, and the caller gives it. Figma draws the Icon/None
      placeholder and swaps the instance, recording no prop, so it is declared here.

follows:
  root.radius:
    axes: [size, shape]
    reason: >-
      What the shape axis is for: square takes radius.control and round radius.pill, at every
      size, priority and state.

  root.shadow:
    axes: [size, prio, state]
    reason: >-
      As Button (owner decision 2026-09-23 for its lg): drawn as Figma draws it. lg is flat,
      keeping only the focus ring, so the shadow depends on size as well as on the paint axes.
      Figma also rings a pressed primary or secondary at sm and md, where Button keeps its control
      shadow; followed here, and raised with SOLAR.

  root.borderWidth:
    axes: [size, prio, state]
    reason: >-
      Drawn as Figma draws it. Primary has a 1px border at sm, at rest, in focus and while loading,
      and none on hover, press or disable, nor at md or lg; secondary has one at sm and md in
      every state, and tertiary none. So the border depends on priority and state as
      well as size. Button keeps its border in every state, which is raised with SOLAR.

accept:
  component.icon button.root.borderColor@size=md:
    reason: >-
      Primary draws a 1px color.border.medium border at sm and none at md, so the colour Figma
      leaves off at md is never drawn; the border width, which follows size, priority and state,
      carries the difference. The inconsistency with Button's primary border is raised with SOLAR.
  component.icon button.root.borderColor@size=lg:
    reason: As at md, the border width is 0 at lg, so the colour is never drawn.

bind:
  icon.width:
    tokens: { 12: icon.xs, 16: icon.sm, 20: icon.md }
    reason: >-
      Same values, governed tokens, one step of the icon ladder per size; the icon's height is
      already bound to them.

allowLiteral:
  root.height:
    reason: >-
      As Button: SOLAR publishes no control height token (owner decision 2026-09-23, raised as a
      governance gap). Drawn 32, 40 and 48; the description's 28, 36 and 44 disagree, which the
      design review lists (section 4).
  root.width:
    reason: An icon button is square, so its width is its height, under the same decision.
