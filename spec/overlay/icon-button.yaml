# Hand-written decisions about SOLAR Icon Button, applied over spec/components/icon-button.json by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Addresses use Figma's axis names (prio, not variant); `rename` is applied last.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Icon Button

base:
  mui: IconButton
  flutter: IconButton
  reason: >-
    The closest stock control on each platform. MUI IconButton takes loading and disabled and
    supplies focus handling and keyboard activation; Flutter's IconButton takes a ButtonStyle, as
    FilledButton does for Button, so the same style builder restyles it.

slots:
  iconNone:
    name: icon
    type: icon
    reason: >-
      The icon is what an icon button is for, and the caller gives it. Figma draws the Icon/None
      placeholder and swaps the instance, recording no prop, so it is declared here.

follows:
  root.radius:
    axes: [size, shape]
    reason: >-
      What the shape axis is for: square takes radius.control and round radius.pill, at every
      size, priority and state.

bind:
  root.height:
    tokens: { 32: size.control.sm, 40: size.control.md, 48: size.control.lg }
    reason: >-
      As Button's height: size.control, one step per size, which SOLAR added on 2026-09-25;
      Figma leaves the height unbound, which the design review asks SOLAR to bind.
  icon.height:
    tokens: { 12: icon.xs, 16: icon.sm, 20: icon.md }
    reason: >-
      Same values, governed tokens, one step of the icon ladder per size; the icon's width is
      already bound to them.

allowLiteral:
  root.width:
    reason: An icon button is square, so its width is its height, under the same decision.
