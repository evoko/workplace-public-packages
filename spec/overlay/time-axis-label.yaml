# Hand-written decisions about SOLAR Time Axis Label, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Time Axis Label

base:
  reason: >-
    An hour marker on the left rail of a week or day grid, as the description says: the hour, aligned to the top of its row, the current hour's tinted in text/feedback/info. A styled part: which hour it marks, in the caller's words, is the caller's.

follows:
  root.height:
    axes: [density]
    reason: >-
      An hour's label is as tall as its hour's row: 48 at the comfortable density, 32 at compact,
      as the Time Slots beside it.
  label.typography:
    axes: [emphasis]
    reason: >-
      The current hour's label is semibold, the others medium, as Figma draws each and the
      description says ("Now emphasis bolds"); set to its styles below.

set:
  label.base.typography:
    token: typography.body.xs.medium
    reason: >-
      Figma draws the hour 10/14 medium, detached from any text style, its size and line height
      bound to caption/xs, whose style is regular: body/xs/medium, the same values, governed.
  label.appearance.emphasis=now, density=comfortable.default.typography:
    token: typography.body.xs.semibold
    reason: >-
      The current hour's is 10/14 semibold, detached as the others are: body/xs/semibold, the same
      values.
  label.appearance.emphasis=now, density=compact.default.typography:
    token: typography.body.xs.semibold
    reason: >-
      As at the comfortable density: 10/14 semibold, detached, body/xs/semibold, the same values.

allowLiteral:
  root.width:
    reason: >-
      The time rail is 56 wide, bound to nothing: SOLAR has no size for it, one of the sizes with
      no variable (a calendar's).
  root.height:
    reason: >-
      An hour's row is 48 tall at the comfortable density and 32 at compact, bound to nothing: SOLAR
      has no size for it, as the Time Slot's.
