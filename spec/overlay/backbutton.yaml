# Hand-written decisions about SOLAR BackButton, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: BackButton

base:
  mui: Button
  flutter: FilledButton
  reason: >-
    A tertiary button with a back arrow: MUI's Button and Flutter's FilledButton, as Button's, which
    supply focus, keyboard activation and the disabled and loading states; the recipe restyles
    them. The arrow is SOLAR's ArrowLeft icon, drawn by the shells.

bind:
  root.height:
    tokens: { 32: size.control.sm, 40: size.control.md }
    reason: >-
      As Button's height: size.control, one step per size, which SOLAR added on 2026-09-25;
      Figma leaves the height unbound, which the design review asks SOLAR to bind.
  iconArrowLeft.width:
    tokens: { 20: icon.md, 16: icon.sm }
    reason: >-
      Same values, governed tokens, a step of the icon ladder per size; the arrow's height is
      already bound to them.
