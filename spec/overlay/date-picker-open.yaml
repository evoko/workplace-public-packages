# Hand-written decisions about SOLAR Date Picker Open, applied over its IR by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Format: packages/codegen/src/normalize/overlay.mjs.

component: Date Picker Open

base:
  reason: >-
    The calendar a DatePicker opens, or the page holds inline: a month's header with the previous
    and next months, its weekdays, and a grid of Date Picker Day Cells, one date chosen (owner
    decisions 2026-09-24: single dates; the week starts on the locale's first day). Bespoke on
    both platforms, a grid the arrow keys move the focus in, drawn with the shared layer helpers;
    its dates from the platform's own calendar, not a picker library, which draws its own days.

composes:
  Day Cell:
    name: Date Picker Day Cell
    reason: >-
      Figma names two components Day Cell; the calendar's grid holds the date picker's (the
      overlay of components/inputs Day Cell names it Date Picker Day Cell).

follows:
  root.borderWidth:
    axes: [inline]
    reason: >-
      A floating calendar has an edge, shadow and corners, a surface of its own; one in the page
      has none, as its description says ("inline embeds the calendar in the page instead of
      floating it").
  root.radius:
    axes: [inline]
    reason: As the edge, by inline.
  root.direction:
    axes: [type]
    reason: A double calendar lays its two months side by side, a single one stacks its parts.

set:
  root.appearance.inline=true, type=double.default.width:
    keyword: HUG
    reason: >-
      The two months' width, 588, is what the calendar hugs (see the accept below): it is drawn
      hugging them, as the single calendar is.
  dayGridDayCell*.base.width:
    none: true
    reason: >-
      A day is a Date Picker Day Cell, whose 36px is its own: the grid lays it out and never
      sizes it.
  dayGridDayCell*.base.height:
    none: true
    reason: { as: set dayGridDayCell*.base.width }
  containerDayGridDayCell*.base.width:
    none: true
    reason: As the first day's, its own.
  containerDayGridDayCell*.base.height:
    none: true
    reason: { as: set containerDayGridDayCell*.base.width }
  container2DayGridDayCell*.base.width:
    none: true
    reason: As the first day's, its own.
  container2DayGridDayCell*.base.height:
    none: true
    reason: { as: set container2DayGridDayCell*.base.width }

bind:
  monthHeaderIconArrowLeft.width:
    literal: 20
    token: icon.md
    reason: Same value, governed token; the arrow's height is already bound to it.
  monthHeaderIconArrowRight.width:
    literal: 20
    token: icon.md
    reason: As the previous month's arrow.
  containerMonthHeaderIconArrowLeft.width:
    literal: 20
    token: icon.md
    reason: As the single calendar's arrow.
  container2MonthHeaderIconArrowRight.width:
    literal: 20
    token: icon.md
    reason: As the single calendar's arrow.

allowLiteral:
  monthHeader.height:
    reason: >-
      The month's header row is 32 tall, bound to nothing: SOLAR has no size token for it (the
      design review's question on sizes with no variable).
  containerMonthHeader.height:
    reason: As the single calendar's header.
  container2MonthHeader.height:
    reason: As the single calendar's header.

accept:
  component.date picker open.root.width@inline=true, type=double:
    reason: >-
      The two months' width, 588, is what the calendar hugs: two grids of seven 36px days and their
      gaps, and its padding and gap. It hugs, as the single calendar does.
  component.date picker open.sparse@type=double:
    reason: >-
      Figma draws no floating double calendar: it is the inline one's two months on the floating
      calendar's surface, as each axis draws them.
