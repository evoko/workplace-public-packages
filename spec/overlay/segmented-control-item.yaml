# Hand-written decisions about SOLAR Segmented Control Item, applied over its IR by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Format: packages/codegen/src/normalize/overlay.mjs.

component: Segmented Control Item

base:
  flutter: RawRadio
  reason: >-
    One choice of a Segmented Control, which behaves as a radio group, says its description:
    bespoke on the web, a label around a native radio input, so the browser moves between the
    segments with the arrow keys; Flutter's RawRadio under a RadioGroup, which does the same.
    Both draw Figma's segment with the shared layer helpers.

bind:
  iconLeading.width:
    tokens: { 16: icon.sm, 12: icon.xs }
    reason: >-
      Same values, governed tokens, a step of the icon ladder per size; the icon's height is
      already bound to them.
  iconTrailing.width:
    tokens: { 16: icon.sm, 12: icon.xs }
    reason: As the leading icon's.

allowLiteral:
  root.height:
    reason: >-
      A segment is 32 tall at md and 24 at sm, bound to nothing: 24 is none of SOLAR's control
      heights (size.control: 32, 40, 48), and the two stay one decision; the design review asks.

accept:
  component.segmented control item.root.borderWidth@selected=false, state=focus:
    reason: As at rest, a transparent edge; the focus ring is the shadow.
  component.segmented control item.root.borderWidth@selected=false, state=default:
    reason: >-
      An unselected segment has no edge in Figma, where a border takes no room. In CSS it takes
      a pixel a side of a segment that hugs its words, so the code keeps the edge, transparent,
      and a segment does not grow when it is chosen.
  component.segmented control item.root.borderWidth@selected=false, state=hover:
    reason: As at rest, a transparent edge.
