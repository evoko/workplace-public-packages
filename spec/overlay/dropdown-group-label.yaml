# Hand-written decisions about SOLAR Dropdown Group Label, applied over its IR by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Format: packages/codegen/src/normalize/overlay.mjs.

component: Dropdown Group Label

base:
  reason: >-
    A section's heading in a Dropdown Menu, not a row: nothing to choose, so the menu's keyboard
    passes over it. Bespoke on both platforms, a list item of the menu's with its words, drawn with
    the shared layer helpers, as MUI's ListSubheader would be with none of its own look.

set:
  root.base.width:
    keyword: FILL
    reason: >-
      A heading spans its menu, as the rows do: Figma draws it 240 wide (md) and 160 (sm), samples
      of a menu's width.
  root.size.sm.width:
    keyword: FILL
    reason: As md's, the sm heading's 160 a sample of its menu's width.
