# Hand-written decisions about SOLAR Radio, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Radio

base:
  mui: Radio
  flutter: RawRadio
  reason: >-
    Each platform's own radio, for its group: MUI's Radio, a native input that a RadioGroup
    checks by value, and Flutter's RawRadio, which a RadioGroup checks the same way and moves
    between with the arrow keys. Both draw Figma's ring and dot with the shared layer helpers,
    since neither stock radio can take Figma's drawing.

allowLiteral:
  root.width:
    reason: >-
      The ring is 18px, and SOLAR has no control size token (the design review's question on
      control sizes and the target size); carried as Figma's number, as Checkbox's box is.
  root.height:
    reason: { as: allowLiteral root.width }
