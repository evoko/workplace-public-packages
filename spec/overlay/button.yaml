# Hand-written decisions about SOLAR Button, applied over spec/components/button.json by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Addresses use Figma's axis names (prio, not variant); `rename` is applied last.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Button

base:
  mui: Button
  flutter: FilledButton
  reason: >-
    The closest stock control on each platform. MUI Button and Flutter FilledButton both take a
    variant, a size and a disabled state and supply focus, ripple and accessibility; the recipe
    restyles them. Flip to null (bespoke) if the recipe cannot express what SOLAR draws.

rename:
  prio:
    to: variant
    reason: >-
      The docs-to-code design spec names the public prop `variant`, as MUI and most React
      libraries do; `prio` is the Figma property name.

follows:
  label.typography:
    axes: [size, prio, state, danger]
    reason: >-
      Owner decision 2026-09-23: follow Figma exactly. Tertiary hover switches the label to a
      link style (and xl to link/md/default, and danger does not switch), so the label type
      depends on every axis. Still raised with SOLAR as inconsistent.

bind:
  root.paddingTop:
    literal: 0
    token: inset.none
    reason: Same value, governed token. Figma leaves vertical padding unbound at 0.
  root.paddingBottom:
    literal: 0
    token: inset.none
    reason: Same value, governed token. Figma leaves vertical padding unbound at 0.
  root.gap:
    literal: 12
    token: inset.sm
    reason: >-
      Same value, governed token. Only xl leaves its gap unbound; every other size binds an
      inset token.
  iconLeading.height:
    literal: 16
    token: icon.sm
    reason: The icon is square and its width is already bound to icon.sm.
  iconTrailing.height:
    literal: 16
    token: icon.sm
    reason: The icon is square and its width is already bound to icon.sm.

allowLiteral:
  root.height:
    reason: >-
      Owner decision 2026-09-23: carry the fixed heights (40, 32, 48) as literals. SOLAR publishes
      no control height token; raised as a governance gap.
  root.width:
    reason: >-
      xl is fixed at 200 wide and SOLAR publishes no control width token. Treated like the
      heights under the same decision; raised as a governance gap.
  counter.height:
    reason: >-
      The counter badge is fixed at 20 tall and bound to nothing; no SOLAR token names a badge
      height. Raised as a governance gap.

accept:
  component.button.root.shadow@size=xl:
    reason: >-
      Owner decision 2026-09-23: xl stays a size, with its look as Figma draws it. xl is flat by
      design (no shadow, square, borderless, fixed width); raised with SOLAR to confirm.
