# Hand-written decisions about SOLAR Split Dropdown, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Split Dropdown

base:
  reason: >-
    Bespoke on both: a two-zone box drawn from Figma's layers with the shared helpers, the
    caller's content in each zone ("pairs a primary control with supporting details", its
    description says). Nothing in it opens or toggles, whatever its name; no stock component is
    a split panel.

set:
  root.base.width:
    keyword: FILL
    reason: >-
      The box spans the space it is put in: Figma draws it 680 wide, a sample. The caller sizes
      it.
  top.base.height:
    keyword: HUG
    reason: >-
      The top zone holds the primary control, padded 16 above and below: Figma fixes it at 80,
      its 48 control's height with that padding, bound to nothing. It hugs what it holds, which
      draws Figma's 80 for a 48 control and grows with a taller one.
  topContent.base.height:
    keyword: HUG
    reason: >-
      As its zone's, which hugs it: the top content is as tall as what the caller puts in it.
      Figma fills the zone's fixed 80 with it, which the zone now hugs.
