# Hand-written decisions about SOLAR Checkbox, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Checkbox

base:
  mui: Checkbox
  reason: >-
    MUI's Checkbox on the web, for its native input (a form value, a label that toggles it, the
    mixed state announced), with its box, tick and dash drawn from Figma's layers by the shared
    helpers. Bespoke in Flutter, whose Checkbox paints a tick of its own and cannot take Figma's:
    drawn with the same helpers, pressable, and announced as a checkbox.

follows:
  root.direction:
    axes: [checked]
    reason: >-
      Only a checked box holds a mark, and only it is an auto layout, centring its tick or dash;
      the empty box lays nothing out.
  root.align:
    axes: [checked]
    reason: As its direction, the checked box's alone.
  root.gap:
    axes: [checked]
    reason: As its direction, the checked box's alone.
  root.paddingTop:
    axes: [checked]
    reason: As its direction, the checked box's alone.
  root.paddingRight:
    axes: [checked]
    reason: As its direction, the checked box's alone.
  root.paddingBottom:
    axes: [checked]
    reason: As its direction, the checked box's alone.
  root.paddingLeft:
    axes: [checked]
    reason: As its direction, the checked box's alone.
  root.borderWidth:
    axes: [checked, state]
    reason: >-
      A disabled checked box has no edge, checked or mixed, where every other box keeps its
      border: a filled box that cannot be used is drawn flat.

allowLiteral:
  root.width:
    reason: >-
      The box is 16px, and SOLAR has no control size token (the design review's question on
      control sizes and the target size); carried as Figma's number.
  root.height:
    reason: As its width.
  icon.width:
    reason: >-
      The tick's own size, 10 by 7, is its drawing's, as Figma's outline is: a glyph, not an icon
      from the ladder.
  icon.height:
    reason: As its width.
  container.width:
    reason: The dash's own size, 10 by 2, is its drawing's, as the tick's is.
  container.height:
    reason: As its width.

set:
  root.appearance.checked=true, mixed=true.default.borderColor:
    token: color.border.medium
    reason: >-
      The resting mixed box alone is drawn with no edge; the checked box at rest has one, and so
      does the mixed box on hover. Drawn with the checked box's edge, as every other enabled box
      is; the design review asks which SOLAR means.

accept:
  component.checkbox.root.borderWidth@mixed=true:
    reason: >-
      As its colour: the resting mixed box keeps the border every other enabled box has.
