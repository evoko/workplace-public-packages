# Hand-written decisions about SOLAR Password Input, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs. The component's other decisions come with its
# family, F5 of the milestone 4 plan.

component: Password Input

layerNames:
  /Field/•••••••••:
    name: masked value
    reason: >-
      Figma names the layer by what it draws, nine bullets: the masked value in the field. A name
      made of a glyph cannot become code.
