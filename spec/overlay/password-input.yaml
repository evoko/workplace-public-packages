# Hand-written decisions about SOLAR Password Input, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Password Input

layerNames:
  /Field/•••••••••:
    name: masked value
    reason: >-
      Figma names the layer by what it draws, nine bullets: the masked value in the field. A name
      made of a glyph cannot become code.

base:
  mui: InputBase
  flutter: TextField
  reason: >-
    As Text Input: MUI's InputBase on the web, as the field, for its native password input, which a
    password manager fills (the description: "the field remains <input type=\"password\">"); Flutter's
    TextField, undecorated and obscured, as its words. The label, the reveal button, the helper and
    the link below are drawn with the shared layer helpers.

slots:
  forgotPassword:
    name: forgotPassword
    type: text
    reason: >-
      Figma draws a "Forgot password?" link below the focused md field, in the helper's place and
      shown by the helper's prop: a link the caller gives (to its reset flow), drawn below the
      field where given, in every state, beside the helper. A link shown only while the field has
      the focus could not be clicked, since the click takes the focus away first.

derive:
  filled:
    when:
      - value: true
        props: [value]
      - value: false
    reason: >-
      As Text Input's: a field is filled where it holds a value, which the user types or a password
      manager fills, so it is no prop the caller could set against its content.

follows:
  helper.present:
    axes: [size]
    reason: >-
      The helper shows where given, in every state, as Text Input's does, not as a state decides.
  forgotPassword.color:
    axes: []
    reason: >-
      The link is drawn in color.text.secondary, the one colour Figma gives it, wherever it is
      shown: the focused md field is the only variant that draws it.

set:
  root.base.width:
    keyword: FILL
    reason: >-
      A field spans its container, as a form row lays it out: Figma draws it 240 wide (md) and 160
      (sm), samples. The caller sizes it, as a Text Input.
  root.size.sm.width:
    keyword: FILL
    reason: As md's, the sm field's 160 a sample.

bind:
  icon.width:
    tokens: { 16: icon.sm, 12: icon.xs }
    reason: >-
      Same values, governed tokens, a step of the icon ladder per size; the icon's height is
      already bound to them.

allowLiteral:
  field.height:
    reason: >-
      As Text Input's field: SOLAR publishes no control height token (owner decision 2026-09-23,
      raised as a governance gap). Drawn 40 (md) and 32 (sm).

accept:
  component.password input.helper.present@state=focus:
    reason: >-
      The helper shows where given, in every state, as Text Input's does: Figma's focused md field
      swaps it for the forgot-password link, a sample of what may sit below the field, which the
      code draws beside it where the caller gives one (the slot above).
  component.password input.forgotPassword.present@size=sm:
    reason: >-
      As the helper's: the link shows where the caller gives it, at both sizes; Figma draws it in
      the focused md field alone.
