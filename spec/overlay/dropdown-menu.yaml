# Hand-written decisions about SOLAR Dropdown Menu, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Dropdown Menu

base:
  reason: >-
    The floating surface of a trigger's rows and headings (owner decision 2026-09-24: a surface
    that floats where it is anchored). Bespoke on both platforms, drawn with the shared layer
    helpers: on the web its content is MUI's MenuList, for a menu's keyboard, floated by MUI's
    Popover under its trigger; in Flutter a column the arrow keys move along, floated by
    MenuAnchor. Without an anchor it draws in place, as the checks and F7's pickers draw it.

set:
  dropdownGroupLabel.base.width:
    keyword: FILL
    reason: >-
      The heading and the rows are the caller's, and span the menu: Figma draws them 240 wide
      (md) and 160 (sm), samples of a menu's width, which is its widest row's.
  dropdownGroupLabel.size.sm.width:
    keyword: FILL
    reason: As md's, a sample.
  dropdownItem*.base.width:
    keyword: FILL
    reason: As the heading's, the row spans the menu.
  dropdownItem*.size.sm.width:
    keyword: FILL
    reason: As md's, a sample.
