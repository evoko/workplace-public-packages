# Hand-written decisions about SOLAR Tag, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Tag

base:
  reason: >-
    Bespoke on both: a pill drawn from Figma's layers with the shared helpers, its close button a
    pressable of its own. MUI's Chip and Flutter's Chip each lay out a label, an avatar or icon
    and a delete icon with paddings and heights of their own, which fight Figma's five layouts;
    Tag is a label, not a control, so they bring nothing else.

slots:
  label:
    name: label
    type: text
    reason: >-
      The words are the caller's (1 to 3, says the description); Figma records no text prop for
      them.
  iconNone:
    name: icon
    type: icon
    reason: >-
      The icon of an icon+text tag is the caller's: Figma draws the Icon/None placeholder and
      records no prop.
  iconPlus:
    name: icon
    type: icon
    reason: >-
      An icon-only tag's icon is the same slot, drawn alone: Figma's Plus is a sample of the
      caller's icon.

derive:
  type:
    when:
      - value: status
        given: [label]
        props: [indicator]
      - value: closable
        given: [label]
        props: [onClose]
      - value: icon+text
        given: [icon, label]
      - value: icon-only
        given: [icon]
      - value: text-only
        given: [label]
    reason: >-
      Owner decision, 2026-09-23: Tag's type follows from content. The status dot is `indicator`,
      a close button `onClose`, an icon gives icon+text, or icon-only without words, and words
      alone are text-only; so the type is no prop the caller could set against its content.

follows:
  root.gap:
    axes: [type, invert]
    reason: >-
      Each type lays its parts out its own way: the status dot sits inset.xs from its words, an
      icon or the close button inset.2xs, and an icon-only tag has one part and no gap.
  root.paddingLeft:
    axes: [type, invert]
    reason: >-
      The side with a dot or an icon is padded inset.xs, a side with words inset.sm, and an
      icon-only tag not at all: it is a square.
  root.paddingRight:
    axes: [type, invert]
    reason: >-
      As the left: inset.sm beside words, inset.xs beside the close button, and inset.2xs beside
      an inverted tag's larger close button, in every status.
  root.align:
    axes: [type, invert]
    reason: An icon-only tag centres its icon; every other type starts from its leading part.
  root.width:
    axes: [type, invert]
    reason: An icon-only tag is a fixed square; every other type hugs its words.
  iconClose.width:
    axes: [invert]
    reason: >-
      An inverted tag's close button is icon.sm, 16px, in every status, where every other close
      button is icon.xs: the larger target on the stronger fill, with less padding beside it.
  iconClose.height:
    axes: [invert]
    reason: As its width.

bind:
  icon.width:
    literal: 12
    token: icon.xs
    reason: >-
      Same value, governed token; the icon's height is already bound to it ("icon size tracks text
      size").
  iconNone.width:
    literal: 12
    token: icon.xs
    reason: As the icon-only tag's icon.
  iconClose.width:
    tokens: { 12: icon.xs, 16: icon.sm }
    reason: As the icon's, a step of the ladder for each close button; its height is bound already.

set:
  statusIndicator.base.width:
    none: true
    reason: >-
      The dot is a StatusIndicator, whose xs size is its own (8px): the tag places it, and never
      sizes it.
  statusIndicator.base.height:
    none: true
    reason: As its width, the StatusIndicator's own.

allowLiteral:
  root.width:
    reason: >-
      An icon-only tag is a 24px square, and every tag 24 tall, bound to nothing: SOLAR has no
      control height token (the design review's question on control heights, as Button's is).
  root.height:
    reason: As its width.

accept:
  component.tag.sparse@invert=true:
    reason: >-
      Figma draws no inverted status tag: its dot is the status's strong colour, which is the
      inverted tag's fill, so it would not show. The shells refuse an inverted tag with a dot (the
      React types, and an assert in Flutter), as Button Group's refuse the vertical full-width
      group Figma does not draw.
