# Hand-written decisions about SOLAR Popover, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Popover

base:
  mui: Popover
  reason: >-
    An anchored overlay for rich content, as the description says: a title, its words and the
    caller's controls, in a bubble whose tip points at its trigger from the side `placement` names,
    dismissed by Escape or a click outside it, the focus moving into it only where it holds
    controls. MUI's Popover on the web, its paper the drawn surface; in Flutter drawn in an overlay
    over its trigger. Without an anchor it is the surface alone, drawn in place, as the visual checks
    draw it.

follows:
  root.direction:
    axes: [placement]
    reason: >-
      A popover beside its trigger (left, right) lays its bubble and tip out in a row, one above or
      below it in a column, as Figma draws each.
  content.radiusTopLeft:
    axes: [placement]
    reason: >-
      The bubble's corner at its tip is square (radius.none), the others radius.container: the
      corner the tip hangs from turns with the placement, as Figma draws each.
  content.order:
    axes: [placement]
    reason: >-
      Where the tip points up or left (bottom, right), it comes before the bubble, and after it
      elsewhere, as Figma draws each; the size does not move it.
  tip.order:
    axes: [placement]
    reason: { as: follows content.order }
  tip.glyph:
    axes: [placement]
    reason: >-
      The tip is a right-angled triangle whose right angle sits at the bubble's square corner: it
      turns with the placement, and is the same at either size, as Figma draws it.
  content.radiusTopRight:
    axes: [placement]
    reason: { as: follows content.radiusTopLeft }
  content.radiusBottomLeft:
    axes: [placement]
    reason: { as: follows content.radiusTopLeft }

set:
  root.base.shadow:
    none: true
    reason: >-
      Figma puts shadow/dialog on the popover's frame, which has no fill, and so draws only its
      first shadow, cast by the bubble and tip together, and not its 2px ring (Figma draws no spread
      on an unfilled frame). No box shadow draws either: one on the frame would shade the empty
      strip beside the tip, and SOLAR has no drop-shadow token. The bubble carries the shadow
      instead (content.base.shadow); the design review asks.
  content.base.shadow:
    token: shadow.overlay
    reason: >-
      The bubble casts the popover's shadow: shadow.overlay, which the description names ("at the
      overlay z level"), and which, unlike shadow/dialog, has no ring Figma's drawing lacks. The tip
      casts none, as Tooltip's arrow; the design review asks.

allowLiteral:
  content.width:
    reason: >-
      A popover is 320 wide (md) or 240 (sm), bound to nothing: SOLAR has no overlay width, one of
      the sizes with no variable. Its words wrap within it.
  tip.width:
    reason: >-
      The tip is 10 × 10, bound to nothing: SOLAR has no size for an overlay's arrow, as Tooltip's.
  tip.height:
    reason: { as: allowLiteral tip.width }
