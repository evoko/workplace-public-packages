# Hand-written decisions about SOLAR Segmented Control, applied over its IR by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Format: packages/codegen/src/normalize/overlay.mjs.

component: Segmented Control

base:
  reason: >-
    Bespoke on both: a field's label and helper around a track of the caller's segments, drawn
    from Figma's layers with the shared helpers. It is a radio group, as its description says:
    on the web a radiogroup whose segments are native radio inputs of one name, in Flutter a
    RadioGroup, each of which moves between the segments with the arrow keys.

set:
  segmentedControlItem*.base.height:
    none: true
    reason: >-
      A segment's height is its own (32 at md, 24 at sm), and the segments are the caller's: the
      control lays them out and never sizes them, so a segment of the wrong size shows as one.
  segmentedControlItem*.size.sm.height:
    none: true
    reason: As at md, the segment's own height.

shownBy:
  labelLabel:
    slot: label
    reason: >-
      Figma's show label (added 2026-09-25, the prop the design review asked for) shows the
      label's frame, but its words stay hidden in both variants, so a shown label draws only its
      star. Drawn where the caller gives a label, its words and its star; the design review asks
      SOLAR to unhide the words.
