# Hand-written decisions about SOLAR Section Nav Item, applied over its IR by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Format: packages/codegen/src/normalize/overlay.mjs.

component: Section Nav Item

base:
  mui: ButtonBase
  reason: >-
    One item of a section nav rail (settings and admin sub-navigation): a destination, a link where
    it has an `href` and a button otherwise, the current one selected (`aria-current="page"`, its
    description says). MUI's ButtonBase on the web, for its keyboard focus (focus-visible) and its
    link or button element, as Nav Item's; its icon and label drawn with the shared layer helpers.
    Bespoke in Flutter, drawn and pressable.

set:
  root.base.width:
    keyword: FILL
    reason: >-
      An item spans its rail, as a section nav lays its items out: Figma draws it 220 wide in every
      state but rest, where it hugs its words (the design review asks). The rail sizes it.

accept:
  component.section nav item.root.width@state=hover:
    reason: >-
      Figma draws the hovered item 220 wide, bound to nothing, where the resting one hugs its
      words: a sample of the rail's width, which every state of the item spans.
  component.section nav item.root.width@state=focus:
    reason: As the hovered item's, a sample of the rail's width.
  component.section nav item.root.width@state=selected:
    reason: As the hovered item's, a sample of the rail's width.
  component.section nav item.root.width@state=disabled:
    reason: As the hovered item's, a sample of the rail's width.

bind:
  icon.width:
    literal: 16
    token: icon.sm
    reason: Same value, governed token; the icon's height is already bound to it.

allowLiteral:
  root.height:
    reason: >-
      As Button's: SOLAR publishes no control height token (owner decision 2026-09-23, raised as a
      governance gap). An item is drawn 32 tall.
  root.opacity:
    reason: >-
      A disabled item is drawn at 40% opacity. SOLAR has no opacity scale, as for Link's disabled
      50% and Node End's halo; carried as Figma's number, and raised as a governance gap.
