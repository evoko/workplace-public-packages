# Hand-written decisions about SOLAR Context Menu Item, applied over its IR by
# `npm run solar:codegen`. Every rule needs a reason; one that no longer matches the IR fails the
# build. Format: packages/codegen/src/normalize/overlay.mjs.

component: Context Menu Item

base:
  mui: MenuItem
  reason: >-
    One row of a Context Menu: MUI's MenuItem on the web, as a Dropdown Item is, for the menu's
    keyboard (the arrow keys move the focus, and a focused row draws Figma's focus); bespoke in
    Flutter, drawn and pressable. Its icons, words and shortcut drawn with the shared layer helpers.

set:
  root.base.width:
    keyword: FILL
    reason: >-
      A row spans its menu, whose width is its widest row's: Figma draws it 200 wide, a sample.

bind:
  leadingIcon.width:
    literal: 16
    token: icon.sm
    reason: Same value, governed token; the icon's height is already bound to it.
  trailingIcon.width:
    literal: 16
    token: icon.sm
    reason: As the leading icon's.

allowLiteral:
  root.height:
    reason: >-
      A row is 36 tall, bound to nothing, between two of SOLAR's control heights (size.control:
      32, 40); carried as drawn, the design review asks.

follows:
  root.borderWidth:
    axes: [state]
    reason: >-
      A focused row is ringed (Figma, 2026-09-25): an edge in border.feedback.focus.strong beside
      the focus shadow, on the hover fill; no other state has an edge.
