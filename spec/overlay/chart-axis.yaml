# Hand-written decisions about SOLAR Chart Axis, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Chart Axis

base:
  reason: >-
    A chart's axis, as the description says: its line, its tick marks and their labels, drawn by
    the chart library (MUI X Charts, fl_chart; decision) in SOLAR's chart theme, which takes them
    from here. Figma's ticks and labels are samples.

bind:
  axisLine.height:
    literal: 1
    token: border.default
    reason: Same value, governed token, the axis line's thickness, which the theme takes.
  tick*TickMark.width:
    literal: 1
    token: border.default
    reason: Same value, governed token, a tick mark's thickness.

allowLiteral:
  tick*TickMark.height:
    reason: >-
      A tick mark is 4 long, bound to nothing: SOLAR has no size for it, one of the sizes with no
      variable; the theme takes it as Figma draws it.

accept:
  component.chart axis.*:
    reason: >-
      Figma's axis is a sample: its ticks' places and labels (0 to 100) at two lengths. The library
      places the caller's ticks; the theme takes the design, none of which is left open.
