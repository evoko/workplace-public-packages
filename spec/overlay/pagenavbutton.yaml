# Hand-written decisions about SOLAR PageNavButton, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: PageNavButton

base:
  mui: ButtonBase
  reason: >-
    The previous or next button of a Page Navigator, its description says: a secondary button with
    its arrow, "Previous" or "Next", disabled at the ends of the sequence. MUI's ButtonBase on the
    web, for its keyboard focus (focus-visible) and press; its icons and words drawn with the shared
    layer helpers. Bespoke in Flutter, drawn and pressable.

set:
  root.base.width:
    keyword: HUG
    reason: >-
      A button is as wide as its words and arrow, as SOLAR's Button is, so a longer word (a
      translation) fits: Figma draws it 112 wide, bound to nothing (the design review asks).

accept:
  component.pagenavbutton.root.gap@direction=next, state=default:
    reason: As the gap's unbound finding, the same 8 as stack.xs.
  component.pagenavbutton.root.gap@direction=next, state=disabled:
    reason: As the gap's unbound finding, the same 8 as stack.xs.
  component.pagenavbutton.root.gap@direction=next, state=focus:
    reason: As the gap's unbound finding, the same 8 as stack.xs.
  component.pagenavbutton.root.gap@direction=next, state=hover:
    reason: As the gap's unbound finding, the same 8 as stack.xs.
  component.pagenavbutton.root.gap@direction=next, state=pressed:
    reason: As the gap's unbound finding, the same 8 as stack.xs.

bind:
  iconArrowLeft.height:
    literal: 20
    token: icon.md
    reason: Same value, governed token; the icon's width is already bound to it.
  iconArrowRight.height:
    literal: 20
    token: icon.md
    reason: As the left arrow's.

allowLiteral:
  root.height:
    reason: >-
      The button is drawn 36 tall, bound to nothing, between two of SOLAR's control heights
      (size.control: 32, 40); carried as drawn, the design review asks.
