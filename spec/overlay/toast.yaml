# Hand-written decisions about SOLAR Toast, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Toast

base:
  reason: >-
    Bespoke on both: a pill drawn from Figma's layers with the shared helpers, its Tag a SOLAR
    Tag drawn its own way, its action a pressable of its own. Where it appears, and for how long,
    is the app's (MUI's Snackbar, Flutter's ScaffoldMessenger); the toast is what they show.

slots:
  messageGoesHere:
    name: message
    type: text
    reason: >-
      The message is the caller's ("File saved", "Connection lost"); Figma records no text prop
      for it.
  tag:
    name: tag
    type: component
    reason: >-
      The Tag's words are the caller's (what the message is about); Figma records no prop, and
      draws the Tag in every variant.

set:
  tag.base.variant.type:
    keyword: status
    reason: >-
      Figma's Tag instance names type `pill`, a type Tag no longer has; its size and padding are
      a status tag's, a dot and words, which it is drawn as. The design review asks SOLAR to swap
      the instance.
  tag.base.height:
    none: true
    reason: The Tag is 24 tall, its own height; the toast places it and never sizes it.

restyles:
  tag:
    cells: [background, borderColor]
    reason: >-
      Owner decision, 2026-09-24: the toast draws Figma's look, its Tag on `surface/overlay` with
      the toast's own status edge, which is no look of Tag's own; the design review asks whether
      Tag should have it.

bind:
  chevron.width:
    literal: 12
    token: icon.xs
    reason: Same value, governed token; the chevron's height is already bound to it.
