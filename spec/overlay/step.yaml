# Hand-written decisions about SOLAR Step, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Step

base:
  reason: >-
    One step of a Stepper, its description says: its Stepper Indicator and label (round, the
    label under the circle), or its numbered label over a line (horizontal). Drawn with the shared
    layer helpers on both platforms; a part of a Stepper, not used on its own. Its status is the
    Stepper's to give, from its active step (owner decision 2026-09-24).

follows:
  root.align:
    axes: [type]
    reason: >-
      A round step centres its label under its circle; a horizontal one lays its label and line
      out from the start, as Figma draws each type.
  root.gap:
    axes: [type]
    reason: >-
      As the alignment, by type: the round step's gap is a row's (inset.xs), the horizontal's a
      stack's (stack.xs), both 8.
  root.width:
    axes: [type]
    reason: >-
      A round step hugs its circle and label; a horizontal one shares the stepper's width with the
      others, as Figma draws each.

set:
  stepperIndicator.base.width:
    none: true
    reason: >-
      The circle is a SOLAR Stepper Indicator, whose 24px is its own: the step places it, and
      never sizes it.
  stepperIndicator.base.height:
    none: true
    reason: { as: set stepperIndicator.base.width }

allowLiteral:
  line.height:
    reason: >-
      A horizontal step's line is 3px thick, bound to nothing: SOLAR has no line-thickness token
      beside its border widths (the design review's question on sizes with no variable).
