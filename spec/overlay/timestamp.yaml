# Hand-written decisions about SOLAR Timestamp, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Timestamp

base:
  reason: >-
    Bespoke on both platforms: a line of text. Its format changes only the words, which the app
    formats in the user's locale and timezone (owner decision, 2026-09-24); the component marks
    them up as a time (<time datetime> on the web) and, for combined, carries the absolute time as
    a tooltip.
