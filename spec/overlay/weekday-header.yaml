# Hand-written decisions about SOLAR Weekday Header, applied over its IR by `npm run solar:codegen`.
# Every rule needs a reason; one that no longer matches the IR fails the build.
# Format: packages/codegen/src/normalize/overlay.mjs.

component: Weekday Header

base:
  reason: >-
    A calendar grid's column header, as the description says: the weekday, today's tinted in text/feedback/info. A styled part, as the calendar family is (decision): which day it heads is the caller's.

set:
  root.base.width:
    keyword: FILL
    reason: >-
      A weekday's header fills its column of the grid, as the days under it do: Figma draws a 160
      sample.

allowLiteral:
  root.height:
    reason: >-
      A weekday's header is 36 tall, bound to nothing: SOLAR has no size for it, one of the sizes
      with no variable (a calendar's row).
